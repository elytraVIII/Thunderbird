name: Build Thunderbird Package for GhostBSD

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Boot FreeBSD Environment and Build Package
      uses: cross-platform-actions/action@v0.32.0
      with:
        operating_system: freebsd
        version: '15.0' # Aligns natively with modern GhostBSD bases
        memory: '7G'     # Maximizes RAM constraints for compiler tasks
        cpu_count: 2
        run: |
          # Avoid interactive package mismatches entirely
          export IGNORE_OSVERSION=yes
          
          echo "Updating core package repository..."
          sudo -E pkg update -f
          
          echo "Installing Git to handle ports..."
          sudo -E pkg install -y git
          
          echo "Cloning Official FreeBSD Ports Tree..."
          # Changed from GitHub mirror to official, highly reliable upstream repo
          sudo git clone --depth 1 https://git.freebsd.org/ports.git /usr/ports
          
          echo "Gathering and installing all build and runtime dependencies..."
          cd /usr/ports/mail/thunderbird
          
          # Wrapped in strict bash execution style to block GitHub Actions text truncation
          sudo sh -c 'pkg install -y $(make missing)'
          
          echo "Compiling Thunderbird and generating standalone package..."
          sudo -E make BATCH=yes package
          
          echo "Staging file artifacts..."
          mkdir -p ../output-pkg
          cp /usr/ports/public/packages/All/thunderbird-*.pkg ../output-pkg/

    - name: Upload Thunderbird Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: thunderbird-ghostbsd-package
        path: ../output-pkg/thunderbird-*.pkg
        retention-days: 7
        
