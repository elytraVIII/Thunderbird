name: Build Thunderbird Package for GhostBSD

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Boot FreeBSD Environment and Build Package
      uses: cross-platform-actions/action@v0.26.0
      with:
        operating_system: freebsd
        version: '15.0' # Matched directly to GhostBSD 26.1 baseline
        memory: '7G'     # Maximizes memory space on standard runners for heavy compiling
        cpu_count: 2
        run: |
          # Export to bypass interactive prompts on unexpected packaging minor mismatches
          export IGNORE_OSVERSION=yes
          
          echo "Updating core package repository..."
          sudo -E pkg update -f
          
          echo "Installing Git to pull Ports tree..."
          sudo -E pkg install -y git
          
          echo "Cloning FreeBSD Ports Tree..."
          sudo git clone --depth 1 https://github.com /usr/ports
          
          echo "Installing all build and runtime dependencies via binary packages..."
          cd /usr/ports/mail/thunderbird
          sudo -E pkg install -y $(make missing)
          
          echo "Compiling Thunderbird and packaging into a standalone .pkg bundle..."
          # BATCH=yes bypasses interactive prompts inside the port compilation loop
          sudo -E make BATCH=yes package
          
          echo "Staging the completed package file for upload..."
          mkdir -p $HOME/output-pkg
          cp /usr/ports/public/packages/All/thunderbird-*.pkg $HOME/output-pkg/

    - name: Upload Thunderbird Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: thunderbird-ghostbsd-package
        path: ~/output-pkg/thunderbird-*.pkg
        retention-days: 7
        
